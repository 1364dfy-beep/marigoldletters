name: daily-episode

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC every day; GitHub may delay scheduled runs
  workflow_dispatch:          # manual "Run workflow" button

concurrency:
  group: episode
  cancel-in-progress: false

permissions:
  contents: write             # needed to commit state/episodes.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies (ffmpeg + font for captions)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Python dependencies
        run: |
          pip install -r requirements.txt
          if grep -qE '^format:[[:space:]]*narrated' config/settings.yaml; then pip install -r requirements-narrated.txt; fi

      - name: Generate episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}                 # free photos (quotes profile)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # free AI images (horror profile only)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}                                 # optional: lets the job store a rotated refresh token
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}         # optional: sends you the caption
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Upload video + metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: episode-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Commit story state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/episodes.json
          git diff --cached --quiet || (git commit -m "state: episode ${{ github.run_number }} [skip ci]" && git push)
